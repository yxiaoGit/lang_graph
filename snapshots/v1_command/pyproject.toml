[project]
name = "airfryer-agent"
version = "0.1.0"
description = "LangChain agent that simulates an air fryer with human-in-the-loop stops"
requires-python = ">=3.10"
dependencies = ["langchain-core>=0.3", "langgraph>=1.0", "grandalf>=0.8"]

[project.scripts]
airfryer = "airfryer_agent.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["airfryer_agent*"]
